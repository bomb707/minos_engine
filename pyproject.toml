[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minos-engine"
version = "0.1.0"
description = "MINOS_ENGINE — protocol-faithful GATK config engine for Minos Bittensor Subnet 107"
readme = "README.md"
# Python 3.12 is the only supported/tested/qualified runtime (matches the subnet).
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "MINOS_ENGINE" }]
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "referencing>=0.30",
    # Layer 1 — truth-free BAM/reference profiling (CPython 3.12 wheels).
    "pysam>=0.22,<0.23",
    "pyarrow>=16,<18",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-jsonschema",
]

[project.scripts]
minos-engine = "minos_engine.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minos_engine = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]
# E501: long lines are acceptable in tables/messages (line-length guides formatting).
# UP042: we intentionally use (str, Enum) rather than StrEnum for broad compatibility.
ignore = ["E501", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["minos_engine"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["minos_engine"]
exclude = ['(^|/)(\.venv|build|dist)(/|$)']

[[tool.mypy.overrides]]
module = ["yaml", "jsonschema", "jsonschema.*", "pysam", "pysam.*", "pyarrow", "pyarrow.*", "numpy", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]
