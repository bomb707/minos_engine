[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minos-engine"
version = "0.1.0"
description = "MINOS_ENGINE — protocol-faithful GATK config engine for Minos Bittensor Subnet 107"
readme = "README.md"
# Python 3.12 is the only supported/tested/qualified runtime (matches the subnet).
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "MINOS_ENGINE" }]
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "referencing>=0.30",
    # Layer 1 — truth-free BAM/reference profiling (CPython 3.12 wheels).
    "pysam>=0.22,<0.23",
    "pyarrow==17.0.0",
    "numpy>=1.26,<3",
    # Layer 2 (L2-B) — PostgreSQL 16 storage foundation.
    "SQLAlchemy>=2,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    # Layer 2 (L2-G) -- expected-score model training. CPU only: Ridge/LogisticRegression and
    # the HistGradientBoosting pair all honour sample_weight, which EQUAL_BAM_TOTAL requires.
    # EXACT, not a range. A model fitted under 1.5.0 and one fitted under 1.9.0 are not the
    # same experiment; minos_engine.models.runtime verifies this before the first fit.
    "scikit-learn==1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-jsonschema",
    # Local, root-free ephemeral PostgreSQL 16 for L2-B integration tests. CI uses a
    # PostgreSQL 16 service container instead (MINOS_DATABASE_URL).
    "pgserver>=0.1.4",
]

[project.scripts]
minos-engine = "minos_engine.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minos_engine = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]
# E501: long lines are acceptable in tables/messages (line-length guides formatting).
# UP042: we intentionally use (str, Enum) rather than StrEnum for broad compatibility.
ignore = ["E501", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["minos_engine"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["minos_engine"]
exclude = ['(^|/)(\.venv|build|dist)(/|$)']

[[tool.mypy.overrides]]
module = ["yaml", "jsonschema", "jsonschema.*", "pysam", "pysam.*", "pyarrow", "pyarrow.*", "numpy", "numpy.*", "alembic", "alembic.*", "sklearn", "sklearn.*", "scipy", "scipy.*", "joblib", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]
