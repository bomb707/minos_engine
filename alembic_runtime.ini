# Operational RUNTIME OVERLAY lineage — separate from alembic.ini on purpose.
#
#   alembic -c alembic_runtime.ini upgrade head
#
# It advances runtime.alembic_version_runtime and never touches public.alembic_version.
# The main chain in alembic.ini stays exactly where the deployment put it.
[alembic]
script_location = migrations_runtime
prepend_sys_path = src
path_separator = os
version_path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
