# MINOS_ENGINE — Alembic configuration (L2-B, Layer 2 database).
#
# Credential-free by design: the database URL is supplied only via the
# MINOS_DATABASE_URL environment variable (see migrations/env.py). No
# sqlalchemy.url is set here and no credentials are ever committed.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
version_path_separator = os
# sqlalchemy.url is intentionally UNSET — env.py resolves MINOS_DATABASE_URL.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
