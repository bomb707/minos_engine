# MINOS_ENGINE — Alembic configuration placeholder.
#
# Stage 0 does NOT add a PostgreSQL runtime dependency and does NOT run any
# migrations. This file exists only to reserve the canonical location declared
# by the specifications (Overall spec §5). The actual migration environment,
# SQLAlchemy models, and versioned migrations are introduced in Stage 4
# (Layer 2 database), and only after L1-READY. Do not wire a live database URL
# here during Stage 0.

[alembic]
script_location = migrations
# sqlalchemy.url is intentionally left unset in Stage 0.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
