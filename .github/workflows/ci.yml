name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: quality (python-3.12)
    runs-on: ubuntu-latest

    # PostgreSQL 16 service for L2-B integration tests (real DB, never SQLite).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Credentials are confined to CI test configuration; never committed.
      MINOS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/minos_ci

    steps:
      # Full history: qualification verifies historical commits/trees/blobs
      # (the accepted Stage 0 commit 4a5a14d and its evidence). A shallow clone
      # lacks these objects and the git-bound verifier correctly fails closed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Runtime assertion (Python 3.12 only)
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"

      - name: Install (editable, with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Git-history preflight (committed gates)
        run: >-
          minos-engine git-history check
          --protocol-gate gates/protocol-ready.json
          --twin-gate gates/twin-ready.json
          --base-dir .

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy src

      - name: Pytest (JUnit XML)
        run: pytest --junitxml=reports/ci-junit.xml

      - name: Coverage (>= 90%)
        run: >-
          pytest
          --cov=src/minos_engine
          --cov-fail-under=90
          --cov-report=term-missing
          --cov-report=xml:reports/ci-coverage.xml

      - name: CLI smoke — doctor
        run: minos-engine doctor --json

      - name: CLI smoke — protocol snapshot
        run: minos-engine protocol snapshot --fixture tests/fixtures/api/valid_round.json

      - name: CLI smoke — config validate
        run: >-
          minos-engine config validate
          --config tests/fixtures/gatk/default_config.json
          --parameter-space tests/fixtures/api/gatk_parameter_space.json

      - name: CLI smoke — twin plan (no execution)
        run: minos-engine twin plan --request tests/fixtures/twin/replay/valid.json --json

      - name: CLI smoke — twin replay (fixture-backed)
        run: minos-engine twin replay --fixture tests/fixtures/twin/replay/valid.json --json

      - name: CLI smoke — twin parity
        run: >-
          minos-engine twin parity
          --expected tests/fixtures/twin/parity/expectation.json
          --observed tests/fixtures/twin/parity/observation_match.json

      - name: Gate — PROTOCOL-READY (git-bound evidence)
        run: minos-engine gate require-pass --gate gates/protocol-ready.json --base-dir .

      - name: Gate — TWIN-READY (accepted prerequisite + git-bound evidence)
        run: minos-engine twin gate require-pass --gate gates/twin-ready.json --base-dir .

      - name: Gate — TWIN-READY non-mutating check (Commit A evidence + descent)
        run: minos-engine twin qualify --check --gate gates/twin-ready.json --base-dir .

      # Layer 1 uses synthetic pysam fixtures in CI; the external real BAM is a
      # separate qualification input recorded in the committed integration report.
      - name: CLI smoke — Layer 1 synthetic profile
        run: python scripts/layer1_smoke.py

      - name: Gate — L1-READY (accepted prerequisites + git-bound evidence)
        run: minos-engine layer1 gate require-pass --gate gates/l1-ready.json --base-dir .

      - name: Gate — L1-READY non-mutating check (Commit A evidence + descent)
        run: minos-engine layer1 qualify --check --gate gates/l1-ready.json --base-dir .

      # --- L2-B PostgreSQL 16 storage foundation ---------------------------------
      - name: Wait for PostgreSQL 16
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 2
          done
          psql "$MINOS_DATABASE_URL" -c "SELECT version();"

      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Confirm migration head revision
        run: alembic current | grep 0001_l2b_initial

      - name: Alembic downgrade base (verify stage-owned removal)
        run: |
          alembic downgrade base
          python - <<'PY'
          from sqlalchemy import create_engine, text
          from minos_engine.storage.constants import SCHEMAS
          from minos_engine.storage.database import database_url
          e = create_engine(database_url())
          with e.connect() as c:
              n = c.execute(
                  text("SELECT count(*) FROM pg_namespace WHERE nspname = ANY(:s)"),
                  {"s": list(SCHEMAS)},
              ).scalar()
          assert n == 0, f"stage schemas not removed: {n}"
          PY

      - name: Alembic re-upgrade + confirm head
        run: |
          alembic upgrade head
          alembic current | grep 0001_l2b_initial

      - name: Migration immutability + frozen inventory tests
        run: pytest tests/integration/layer2_db/test_migration_immutability.py -q

      - name: Admin ownership / capability + role-denial tests
        run: >-
          pytest
          tests/integration/layer2_db/test_admin_ownership.py
          tests/integration/layer2_db/test_roles_isolation.py -q

      - name: L2-B PostgreSQL integration tests (must not skip in CI)
        run: pytest tests/integration/layer2_db -q

      - name: Gate — DB-READY (if present)
        run: |
          if [ -f gates/db-ready.json ]; then
            minos-engine layer2 db gate require-pass --gate gates/db-ready.json --base-dir .
            minos-engine layer2 db qualify --check --gate gates/db-ready.json --base-dir .
          else
            echo "gates/db-ready.json not present (DB-READY evidence lives in Commit P)"
          fi

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-py3.12
          path: |
            reports/ci-junit.xml
            reports/ci-coverage.xml
          if-no-files-found: ignore
