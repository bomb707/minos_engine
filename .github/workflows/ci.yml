name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: quality (python-3.12)
    runs-on: ubuntu-latest

    # PostgreSQL 16 service for L2-B integration tests (real DB, never SQLite).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Canonical operational database name (owner decision) — CI exercises the
          # real operational identity, not a throwaway CI-only name.
          POSTGRES_DB: minos_engine_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Credentials are confined to CI test configuration; never committed. The
      # database name is the canonical operational name (minos_engine_db) so CI
      # exercises the operational-identity guard against the real name.
      MINOS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/minos_engine_db

    steps:
      # Full history: qualification verifies historical commits/trees/blobs
      # (the accepted Stage 0 commit 4a5a14d and its evidence). A shallow clone
      # lacks these objects and the git-bound verifier correctly fails closed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Runtime assertion (Python 3.12 only)
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"

      - name: Install (editable, with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Git-history preflight (committed gates)
        run: >-
          minos-engine git-history check
          --protocol-gate gates/protocol-ready.json
          --twin-gate gates/twin-ready.json
          --base-dir .

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy src

      - name: Pytest (full regression + coverage >= 90%)
        # ONE full-suite invocation producing both the JUnit report and the coverage gate.
        # Running these as two separate steps executed the entire suite twice for no
        # additional signal, doubling CI wall-clock.
        run: >-
          pytest
          --junitxml=reports/ci-junit.xml
          --cov=src/minos_engine
          --cov-fail-under=90
          --cov-report=term-missing
          --cov-report=xml:reports/ci-coverage.xml

      - name: CLI smoke — doctor
        run: minos-engine doctor --json

      - name: CLI smoke — protocol snapshot
        run: minos-engine protocol snapshot --fixture tests/fixtures/api/valid_round.json

      - name: CLI smoke — config validate
        run: >-
          minos-engine config validate
          --config tests/fixtures/gatk/default_config.json
          --parameter-space tests/fixtures/api/gatk_parameter_space.json

      - name: CLI smoke — twin plan (no execution)
        run: minos-engine twin plan --request tests/fixtures/twin/replay/valid.json --json

      - name: CLI smoke — twin replay (fixture-backed)
        run: minos-engine twin replay --fixture tests/fixtures/twin/replay/valid.json --json

      - name: CLI smoke — twin parity
        run: >-
          minos-engine twin parity
          --expected tests/fixtures/twin/parity/expectation.json
          --observed tests/fixtures/twin/parity/observation_match.json

      - name: Gate — PROTOCOL-READY (git-bound evidence)
        run: minos-engine gate require-pass --gate gates/protocol-ready.json --base-dir .

      - name: Gate — TWIN-READY (accepted prerequisite + git-bound evidence)
        run: minos-engine twin gate require-pass --gate gates/twin-ready.json --base-dir .

      - name: Gate — TWIN-READY non-mutating check (Commit A evidence + descent)
        run: minos-engine twin qualify --check --gate gates/twin-ready.json --base-dir .

      # Layer 1 uses synthetic pysam fixtures in CI; the external real BAM is a
      # separate qualification input recorded in the committed integration report.
      - name: CLI smoke — Layer 1 synthetic profile
        run: python scripts/layer1_smoke.py

      - name: Gate — L1-READY (accepted prerequisites + git-bound evidence)
        run: minos-engine layer1 gate require-pass --gate gates/l1-ready.json --base-dir .

      - name: Gate — L1-READY non-mutating check (Commit A evidence + descent)
        run: minos-engine layer1 qualify --check --gate gates/l1-ready.json --base-dir .

      # --- L2-B PostgreSQL 16 storage foundation ---------------------------------
      - name: Wait for PostgreSQL 16
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 2
          done
          psql "$MINOS_DATABASE_URL" -c "SELECT version();"

      - name: Alembic upgrade head — verify the repository's single CURRENT head
        run: |
          alembic upgrade head
          python - <<'PY'
          # Dynamic CURRENT-head verification: the repository must declare exactly one head, and
          # the database must be at that head. Never hard-code a revision here — later stages add
          # additive migrations and the current head legitimately advances. Historical, stage-local
          # revision assertions elsewhere in this workflow stay explicit on purpose.
          from alembic.config import Config
          from alembic.runtime.migration import MigrationContext
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine

          from minos_engine.storage.database import database_url

          script = ScriptDirectory.from_config(Config("alembic.ini"))
          heads = tuple(script.get_heads())
          assert len(heads) == 1, f"expected exactly one Alembic head, found {heads}"

          engine = create_engine(database_url())
          try:
              with engine.connect() as connection:
                  current = tuple(MigrationContext.configure(connection).get_current_heads())
          finally:
              engine.dispose()

          assert current == heads, (current, heads)
          print(f"current Alembic head verified: {heads[0]}")
          PY

      - name: L2-F2 stage boundary — 0009 down to 0008 and back
        run: |
          python - <<'PY'
          # Explicit 0009 appears ONLY here, where the stage boundary is the subject. The generic
          # current-head check above stays dynamic so later migrations do not break it.
          import subprocess

          from sqlalchemy import create_engine, text

          from minos_engine.storage.database import database_url

          def revision() -> str:
              engine = create_engine(database_url())
              try:
                  with engine.connect() as connection:
                      return str(
                          connection.execute(
                              text("SELECT version_num FROM alembic_version")
                          ).scalar()
                      )
              finally:
                  engine.dispose()

          def objects() -> set[str]:
              engine = create_engine(database_url())
              try:
                  with engine.connect() as connection:
                      rows = connection.execute(text(
                          "SELECT tablename FROM pg_tables WHERE schemaname='evaluation' "
                          "UNION ALL SELECT viewname FROM pg_views WHERE schemaname='evaluation'"
                      ))
                      return {r[0] for r in rows}
              finally:
                  engine.dispose()

          assert revision() == "0009_l2f_evaluation_results", revision()
          at_head = objects()
          for name in (
              "l2f_evaluation_results",
              "l2f_evaluation_failures",
              "l2f_completed_execution_inputs",
              "l2f_train_truth_registration_targets",
          ):
              assert name in at_head, name

          subprocess.run(
              ["alembic", "downgrade", "0008_l2f_execution_results"], check=True
          )
          assert revision() == "0008_l2f_execution_results", revision()
          removed = objects()
          for name in (
              "l2f_evaluation_results",
              "l2f_evaluation_failures",
              "l2f_completed_execution_inputs",
              "l2f_train_truth_registration_targets",
          ):
              assert name not in removed, f"{name} survived downgrade"
          assert "evaluations" in removed, "the legacy L2-B placeholder must be preserved"

          subprocess.run(["alembic", "upgrade", "head"], check=True)
          assert revision() == "0009_l2f_evaluation_results", revision()
          assert objects() == at_head, "re-upgrade did not restore the 0009 inventory"
          print("L2-F2 stage boundary verified: 0009 -> 0008 -> 0009")
          PY

      - name: Alembic downgrade to 0005 (L2-F removed, L2-E retained) then re-upgrade
        run: |
          alembic downgrade 0005_l2e_feature_view
          alembic current | grep 0005_l2e_feature_view
          python - <<'PY'
          from sqlalchemy import create_engine, text
          from minos_engine.storage.database import database_url
          l2f = ("l2f_experiment_plans","l2f_experiment_plan_members","l2f_config_payloads",
                 "l2f_experiment_plan_configs","l2f_experiment_jobs")
          e = create_engine(database_url())
          with e.connect() as c:
              present = c.execute(text("SELECT count(*) FROM information_schema.tables WHERE table_schema='experiments' AND table_name = ANY(:n)"), {"n": list(l2f)}).scalar()
              targets = c.execute(text("SELECT count(*) FROM pg_constraint WHERE conname LIKE 'uq_l2f%'")).scalar()
          e.dispose()
          assert present == 0, f"L2-F tables not removed on downgrade to 0005: {present}"
          assert targets == 0, f"L2-F composite targets not removed on downgrade: {targets}"
          PY
          alembic upgrade 0006_l2f_experiment_plan
          alembic current | grep 0006_l2f_experiment_plan

      - name: Alembic downgrade to 0004_l2d_profile_ingestion (L2-E removed, L2-D retained)
        run: |
          alembic downgrade 0004_l2d_profile_ingestion
          alembic current | grep 0004_l2d_profile_ingestion
          python - <<'PY'
          from sqlalchemy import create_engine, text
          from minos_engine.storage.database import database_url
          l2e = ("feature_sets", "feature_matrices", "feature_matrix_members")
          l2d = ("bam_profiles", "profile_ingest_attempts", "profile_snapshots", "profile_snapshot_members")
          eng = create_engine(database_url())
          with eng.connect() as c:
              present_l2e = c.execute(
                  text("SELECT count(*) FROM information_schema.tables WHERE table_name = ANY(:n)"),
                  {"n": list(l2e)},
              ).scalar()
              present_l2d = c.execute(
                  text("SELECT count(*) FROM information_schema.tables WHERE table_name = ANY(:n)"),
                  {"n": list(l2d)},
              ).scalar()
              trainer_artifacts = c.execute(
                  text("SELECT has_table_privilege('minos_trainer','catalog.artifacts','SELECT')")
              ).scalar()
              evaluator_artifacts = c.execute(
                  text("SELECT has_table_privilege('minos_evaluator','catalog.artifacts','SELECT')")
              ).scalar()
          eng.dispose()
          assert present_l2e == 0, f"L2-E objects not removed on downgrade to 0004: {present_l2e}"
          assert present_l2d == 4, f"L2-D objects lost on downgrade to 0004: {present_l2d}"
          assert trainer_artifacts, "trainer catalog.artifacts SELECT not restored on downgrade"
          assert not evaluator_artifacts, "evaluator must never gain catalog.artifacts SELECT"
          PY

      - name: Alembic downgrade to 0003_l2c_split_v2_epochs (L2-D removed, v2 retained)
        run: |
          alembic downgrade 0003_l2c_split_v2_epochs
          alembic current | grep 0003_l2c_split_v2_epochs
          python - <<'PY'
          from sqlalchemy import create_engine, text
          from minos_engine.storage.database import database_url
          l2d = ("bam_profiles", "profile_ingest_attempts", "profile_snapshots", "profile_snapshot_members")
          v2 = ("split_snapshots", "split_epoch_allocations")
          eng = create_engine(database_url())
          with eng.connect() as c:
              present_l2d = c.execute(
                  text("SELECT count(*) FROM information_schema.tables WHERE table_name = ANY(:n)"),
                  {"n": list(l2d)},
              ).scalar()
              present_v2 = c.execute(
                  text("SELECT count(*) FROM information_schema.tables WHERE table_name = ANY(:n)"),
                  {"n": list(v2)},
              ).scalar()
              trainer_restored = c.execute(
                  text("SELECT has_table_privilege('minos_trainer','profiling.profiles','SELECT')")
              ).scalar()
          eng.dispose()
          assert present_l2d == 0, f"L2-D objects not removed on downgrade to 0003: {present_l2d}"
          assert present_v2 == 2, f"v2 epoch objects lost on downgrade to 0003: {present_v2}"
          assert trainer_restored, "legacy profiling.profiles trainer grant not restored"
          PY

      - name: Alembic downgrade to 0002_l2c_dataset_split (v2 removed, v1 retained)
        run: |
          alembic downgrade 0002_l2c_dataset_split
          alembic current | grep 0002_l2c_dataset_split
          python - <<'PY'
          from sqlalchemy import create_engine, text
          from minos_engine.storage.database import database_url
          v2 = ("split_snapshots", "split_epoch_allocations")
          v1 = ("dataset_registry", "split_allocations", "dataset_evaluation_identity")
          e = create_engine(database_url())
          with e.connect() as c:
              present_v2 = c.execute(
                  text("SELECT count(*) FROM information_schema.tables WHERE table_name = ANY(:n)"),
                  {"n": list(v2)},
              ).scalar()
              present_v1 = c.execute(
                  text("SELECT count(*) FROM information_schema.tables WHERE table_name = ANY(:n)"),
                  {"n": list(v1)},
              ).scalar()
          assert present_v2 == 0, f"v2 epoch objects not removed on downgrade to 0002: {present_v2}"
          assert present_v1 == 3, f"frozen v1 L2-C tables not retained (expected 3): {present_v1}"
          PY

      - name: Alembic downgrade to 0001_l2b_initial (L2-C removed, L2-B retained)
        run: |
          alembic downgrade 0001_l2b_initial
          alembic current | grep 0001_l2b_initial
          python - <<'PY'
          from sqlalchemy import create_engine, text
          from minos_engine.storage.database import database_url
          l2c = ("dataset_registry", "split_allocations", "dataset_evaluation_identity")
          l2b_schemas = ["catalog", "profiling", "experiments", "evaluation", "models", "runtime", "audit"]
          e = create_engine(database_url())
          with e.connect() as c:
              present_l2c = c.execute(
                  text("SELECT count(*) FROM information_schema.tables WHERE table_name = ANY(:n)"),
                  {"n": list(l2c)},
              ).scalar()
              l2b_tables = c.execute(
                  text(
                      "SELECT count(*) FROM information_schema.tables "
                      "WHERE table_schema = ANY(:s) AND table_name NOT IN "
                      "('dataset_registry','split_allocations','dataset_evaluation_identity')"
                  ),
                  {"s": l2b_schemas},
              ).scalar()
          assert present_l2c == 0, f"L2-C objects not removed on downgrade to 0001: {present_l2c}"
          assert l2b_tables == 10, f"L2-B tables not retained (expected 10): {l2b_tables}"
          PY

      - name: Alembic downgrade base (all stage-owned objects removed)
        run: |
          alembic downgrade base
          python - <<'PY'
          from sqlalchemy import create_engine, text
          from minos_engine.storage.constants import SCHEMAS
          from minos_engine.storage.database import database_url
          e = create_engine(database_url())
          with e.connect() as c:
              n = c.execute(
                  text("SELECT count(*) FROM pg_namespace WHERE nspname = ANY(:s)"),
                  {"s": list(SCHEMAS)},
              ).scalar()
          assert n == 0, f"stage schemas not removed: {n}"
          PY

      - name: Alembic re-upgrade head — verify the repository's single CURRENT head
        run: |
          alembic upgrade head
          python - <<'PY'
          # Dynamic CURRENT-head verification: the repository must declare exactly one head, and
          # the database must be at that head. Never hard-code a revision here — later stages add
          # additive migrations and the current head legitimately advances. Historical, stage-local
          # revision assertions elsewhere in this workflow stay explicit on purpose.
          from alembic.config import Config
          from alembic.runtime.migration import MigrationContext
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine

          from minos_engine.storage.database import database_url

          script = ScriptDirectory.from_config(Config("alembic.ini"))
          heads = tuple(script.get_heads())
          assert len(heads) == 1, f"expected exactly one Alembic head, found {heads}"

          engine = create_engine(database_url())
          try:
              with engine.connect() as connection:
                  current = tuple(MigrationContext.configure(connection).get_current_heads())
          finally:
              engine.dispose()

          assert current == heads, (current, heads)
          print(f"current Alembic head verified: {heads[0]}")
          PY
          python - <<'PY'
          from sqlalchemy import create_engine, text
          from minos_engine.storage.database import database_url
          l2e = ("feature_sets", "feature_matrices", "feature_matrix_members")
          eng = create_engine(database_url())
          with eng.connect() as c:
              present_l2e = c.execute(
                  text("SELECT count(*) FROM information_schema.tables WHERE table_name = ANY(:n)"),
                  {"n": list(l2e)},
              ).scalar()
              trainer_artifacts = c.execute(
                  text("SELECT has_table_privilege('minos_trainer','catalog.artifacts','SELECT')")
              ).scalar()
          eng.dispose()
          assert present_l2e == 3, f"L2-E objects missing at head: {present_l2e}"
          assert not trainer_artifacts, "trainer catalog.artifacts SELECT must be revoked at 0005"
          PY

      - name: Migration immutability + frozen inventory tests
        run: pytest tests/integration/layer2_db/test_migration_immutability.py -q

      - name: Admin ownership / capability + role-denial tests
        run: >-
          pytest
          tests/integration/layer2_db/test_admin_ownership.py
          tests/integration/layer2_db/test_roles_isolation.py -q

      - name: L2-B PostgreSQL integration tests (must not skip in CI)
        run: pytest tests/integration/layer2_db -q

      - name: L2-C PostgreSQL integration tests (must not skip in CI)
        run: pytest tests/integration/layer2_split -q

      - name: L2-C v2 (epoched split) PostgreSQL integration tests (must not skip in CI)
        run: pytest tests/integration/layer2_split_v2 -q

      - name: L2-D ingest integration suite (real PostgreSQL 16)
        run: pytest tests/integration/layer2_ingest -q

      - name: Gate — DB-READY (immutable L2-B lineage base, if present)
        run: |
          if [ -f gates/db-ready.json ]; then
            minos-engine layer2 db gate require-pass --gate gates/db-ready.json --base-dir .
            minos-engine layer2 db qualify --check --gate gates/db-ready.json --base-dir .
          else
            echo "gates/db-ready.json not present (DB-READY evidence lives in Commit P)"
          fi

      - name: Gate — SPLIT-FROZEN (if present)
        run: |
          if [ -f gates/split-frozen.json ]; then
            minos-engine layer2 split gate require-pass --gate gates/split-frozen.json --base-dir .
            minos-engine layer2 split qualify --check --gate gates/split-frozen.json --base-dir .
          else
            echo "gates/split-frozen.json not present (SPLIT-FROZEN evidence lives in the L2-C evidence commit)"
          fi

      - name: Gate — SPLIT-FROZEN-V2 (if present)
        run: |
          if [ -f gates/split-frozen-v2.json ]; then
            python - <<'PY'
          from pathlib import Path
          from minos_engine.qualification.layer2_split_v2_runner import verify_split_frozen_v2_gate
          root = Path(".").resolve()
          result = verify_split_frozen_v2_gate(root, root / "gates" / "split-frozen-v2.json")
          assert result.ok, f"SPLIT-FROZEN-V2 gate verification failed: {result.reasons}"
          print("SPLIT-FROZEN-V2 gate verified:", result.gate_hash)
          PY
          else
            echo "gates/split-frozen-v2.json not present (evidence lives in the v2 evidence commit)"
          fi

      - name: Gate — INGEST-READY non-mutating check (evidence + v2 ancestry)
        run: |
          if [ -f gates/ingest-ready.json ]; then
            python - <<'PY'
          from pathlib import Path
          from minos_engine.qualification.layer2_ingest_runner import verify_ingest_ready_gate
          root = Path(".").resolve()
          result = verify_ingest_ready_gate(root, root / "gates" / "ingest-ready.json", require_descends=True)
          assert result.ok, f"INGEST-READY gate verification failed: {result.reasons}"
          print("INGEST-READY gate verified:", result.gate_hash)
          PY
          else
            echo "gates/ingest-ready.json not present (evidence lives in the L2-D evidence commit)"
          fi

      - name: Gate — FEATURE-VIEW-READY (manifest-level committed-gate verification)
        run: |
          if [ -f gates/feature-view-ready.json ]; then
            minos-engine layer2 feature-view qualify --check --gate gates/feature-view-ready.json --base-dir .
            minos-engine layer2 feature-view gate require-pass --gate gates/feature-view-ready.json --base-dir .
          else
            echo "gates/feature-view-ready.json not present (E5 evidence commit pending)"
          fi

      - name: Gate — FEATURE-MATRIX-FROZEN-1 (manifest-level committed-gate verification)
        run: |
          if [ -f gates/feature-matrix-frozen-1.json ]; then
            minos-engine layer2 feature-matrix qualify --check --gate gates/feature-matrix-frozen-1.json --base-dir .
            minos-engine layer2 feature-matrix gate require-pass --gate gates/feature-matrix-frozen-1.json --base-dir .
          else
            echo "gates/feature-matrix-frozen-1.json not present (E5 evidence commit pending)"
          fi

      - name: Gate — HARNESS-READY (offline evidence verification; no GATK, no DB, no Alembic)
        run: |
          if [ -f gates/harness-ready.json ]; then
            if [ ! -f reports/layer2/harness-ready-result.json ]; then
              echo "gates/harness-ready.json is committed without reports/layer2/harness-ready-result.json"
              echo "HARNESS-READY evidence must be committed as a coherent gate + result pair"
              exit 1
            fi
            minos-engine layer2 harness qualify --check \
              --gate gates/harness-ready.json \
              --qualification reports/layer2/harness-ready-result.json \
              --base-dir .
            minos-engine layer2 harness gate require-pass \
              --gate gates/harness-ready.json \
              --qualification reports/layer2/harness-ready-result.json \
              --base-dir .
          else
            if [ -f reports/layer2/harness-ready-result.json ]; then
              echo "reports/layer2/harness-ready-result.json is committed without gates/harness-ready.json"
              exit 1
            fi
            echo "HARNESS-READY evidence not committed yet (F7-B pending)"
          fi

      - name: Gate — PROFILE-SNAPSHOT-FROZEN-1 offline verification
        run: |
          if [ -f gates/profile-snapshot-frozen-1.json ]; then
            python - <<'PY'
          from pathlib import Path
          from minos_engine.qualification.layer2_snapshot_runner import verify_snapshot_offline
          result = verify_snapshot_offline(Path(".").resolve(), 1)
          assert result.ok, f"PROFILE-SNAPSHOT-FROZEN-1 offline verification failed: {result.reasons}"
          print("PROFILE-SNAPSHOT-FROZEN-1 offline verification passed")
          PY
          else
            echo "gates/profile-snapshot-frozen-1.json not present (evidence commit pending)"
          fi

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-py3.12
          path: |
            reports/ci-junit.xml
            reports/ci-coverage.xml
          if-no-files-found: ignore
