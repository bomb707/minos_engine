name: CI (fast)

# Tier 1 of the two-tier CI. Runs on every branch push and pull request and is meant to give
# feedback in a couple of minutes: static checks plus every test that does not need a database.
#
# Deliberately NOT here: PostgreSQL integration, migration lifecycle, gate ancestry verification
# and coverage. Those run once in ci-full.yml, which is required before merge, release or a
# DB-V2 stage acceptance. Nothing in this file is repeated there beyond the static checks, which
# cost seconds.

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push on the same ref cancels an obsolete in-progress run.
concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast (python-3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Shallow clone is sufficient: this tier verifies no git-bound gate ancestry.
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Runtime assertion (Python 3.12 only)
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"

      - name: Install (editable, with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy src

      # No MINOS_DATABASE_URL is set and no PostgreSQL service is started: the fast tier is
      # exactly the set of tests that need neither.
      - name: Pytest — fast tier
        run: >-
          pytest
          tests/unit
          tests/leakage
          tests/determinism
          tests/protocol_contract

      - name: DB-V2 design reports — strict parse, contract hash, cross-reference
        run: python scripts/dbv2_audit.py validate

      - name: Test inventory — no drift from the committed report
        run: python scripts/test_inventory.py verify
