name: CI (fast)

# Tier 1 of the two-tier CI: static checks plus every test that needs no database, for feedback
# in a couple of minutes.
#
# Deliberately NOT here: PostgreSQL integration, coverage, and the committed-gate verifiers.
# Those run in .github/workflows/ci.yml, which is required before merge, release or a DB-V2
# stage acceptance. A push to a feature branch runs THIS workflow only - it does not trigger
# full qualification.
#
# Trigger matrix (see tests/unit/tools/test_workflow_policy.py, which evaluates the job
# condition against synthetic event payloads rather than matching source text):
#
#   internal branch push, no open PR   -> runs (push event)
#   internal branch push, open PR      -> runs ONCE (the push event; the pull_request is skipped)
#   same-repository pull_request       -> skipped; its push run already covered the commit
#   pull_request from a fork           -> runs (a fork push never reaches this repository)
#   workflow_dispatch                  -> runs

on:
  push:
  pull_request:
  workflow_dispatch:

# Keyed on the effective branch: a fork PR's head label, otherwise the pushed ref. A newer push
# on the same effective branch cancels an obsolete in-progress run.
concurrency:
  group: ci-fast-${{ github.event.pull_request.head.label || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast (python-3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A same-repository pull_request is skipped because the push event for the identical commit
    # already ran this job. A fork pull_request is the only pull_request that still runs, since
    # a fork's push never reaches this repository.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository

    steps:
      # Full history is REQUIRED. tests/unit/storage/test_l2f_harness_verifier_attacks.py and
      # test_l2f_job_enqueue_unit.py build the accepted plan, which runs the E5 prerequisite
      # closure (e5_source_is_commit, head_descends_e5_evidence, ...). A shallow clone lacks
      # those objects and the closure correctly fails closed - which is exactly how the first
      # run of this workflow failed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Runtime assertion (Python 3.12 only)
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"

      - name: Install (editable, with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy src

      # No MINOS_DATABASE_URL is set and no PostgreSQL service is started: the fast tier is
      # exactly the set of tests that need neither.
      - name: Pytest — fast tier
        run: >-
          pytest
          tests/unit
          tests/leakage
          tests/determinism
          tests/protocol_contract

      - name: DB-V2 design reports — strict parse, contract hash, cross-reference
        run: python scripts/dbv2_audit.py validate

      - name: Test inventory — no drift from the committed report
        run: python scripts/test_inventory.py verify
